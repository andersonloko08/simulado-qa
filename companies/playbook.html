<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playbook | InterviewOps Portugal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="companies">
    <header class="topbar">
        <a href="../index.html" class="topbar-content">
            <i class="fa-solid fa-bullseye logo-icon"></i>
            <span>InterviewOps Portugal</span>
        </a>
        <div class="topbar-actions">
            <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <nav class="main-nav">
        <div class="nav-links">
            <a href="../index.html" class="nav-link" data-page="home"><i class="fa-solid fa-house"></i> Home</a>
            <a href="../dashboard/index.html" class="nav-link" data-page="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
            <a href="../modules/index.html" class="nav-link" data-page="modules"><i class="fa-solid fa-book-open"></i> Módulos</a>
            <a href="../mock/index.html" class="nav-link" data-page="mock"><i class="fa-solid fa-microphone"></i> Mock Interview</a>
            <a href="../career/index.html" class="nav-link" data-page="career"><i class="fa-solid fa-compass"></i> Career Engine</a>
            <a href="index.html" class="nav-link" data-page="companies"><i class="fa-solid fa-building"></i> Empresas</a>
            <a href="../english/index.html" class="nav-link" data-page="english"><i class="fa-solid fa-language"></i> English</a>
            <a href="../tracker/index.html" class="nav-link" data-page="tracker"><i class="fa-solid fa-chart-line"></i> Gaps</a>
            <a href="../roadmap/index.html" class="nav-link" data-page="roadmap"><i class="fa-solid fa-route"></i> Roadmap</a>
        </div>
    </nav>

    <main class="container" id="company-container">
        <div class="breadcrumb">
            <a href="../index.html">Home</a> <i class="fa-solid fa-chevron-right"></i>
            <a href="index.html">Empresas</a> <i class="fa-solid fa-chevron-right"></i>
            <span id="bc-company">...</span>
        </div>
        <div class="text-center" style="padding:3rem 0;"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; color: var(--primary);"></i><p class="text-muted mt-2">Carregando playbook...</p></div>
    </main>

    <footer class="footer">
        <p>InterviewOps Portugal &copy; 2026. Desenvolvido para estudos.</p>
    </footer>

    <script src="../javascript/app.js"></script>
    <script>
        const companyId = new URLSearchParams(location.search).get('id') || 'natixis';

        function listBlock(items) {
            return `<ul style="margin:0 0 0 1.3rem;">${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('company-container');
            try {
                const data = await loadJSON('../json/companies.json');
                const c = (data.companies || []).find(x => x.id === companyId);
                if (!c) throw new Error('not found');
                document.getElementById('bc-company').innerText = c.name;
                document.title = `${c.name} Playbook | InterviewOps Portugal`;

                container.innerHTML = `
                    <div class="page-header">
                        <div class="flex-between wrap gap-2 mb-2">
                            <div class="module-icon" style="width:60px;height:60px;font-size:1.7rem;background:var(--primary-light);color:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;"><i class="fa-solid ${c.icon}"></i></div>
                            <div class="flex gap-2 wrap">
                                <span class="badge badge-info"><i class="fa-solid fa-location-dot"></i> ${escapeHtml(c.country)}</span>
                                <span class="badge badge-primary"><i class="fa-solid fa-industry"></i> ${escapeHtml(c.sector)}</span>
                            </div>
                        </div>
                        <h1>${escapeHtml(c.name)}</h1>
                        <div class="flex gap-2 wrap mt-1">${(c.focus || []).map(f => `<span class="tag-badge">${escapeHtml(f)}</span>`).join('')}</div>
                    </div>

                    <div class="content-section">
                        <h2><i class="fa-solid fa-circle-info"></i> Visão geral</h2>
                        <p>${escapeHtml(c.overview)}</p>
                        <h3><i class="fa-solid fa-people-group"></i> Cultura</h3>
                        <p>${escapeHtml(c.culture)}</p>
                    </div>

                    <div class="grid-2">
                        <div class="content-section">
                            <h2><i class="fa-solid fa-briefcase"></i> Negócio</h2>
                            <p>${escapeHtml(c.business)}</p>
                            <h3><i class="fa-solid fa-microchip"></i> Tecnologias</h3>
                            <div class="flex gap-2 wrap">${(c.technologies || []).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('')}</div>
                        </div>
                        <div class="content-section">
                            <h2><i class="fa-solid fa-layer-group"></i> Stack técnica de testes</h2>
                            <p>${escapeHtml(c.technicalStack)}</p>
                            <h3><i class="fa-solid fa-user-tie"></i> Possíveis entrevistadores</h3>
                            <div class="flex gap-2 wrap">${(c.possibleInterviewers || []).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('')}</div>
                        </div>
                    </div>

                    <div class="content-section">
                        <h2><i class="fa-solid fa-comments"></i> Perguntas esperadas</h2>
                        ${listBlock(c.expectedQuestions || [])}
                    </div>

                    <div class="grid-2">
                        <div class="content-section">
                            <h2><i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i> Gaps comuns</h2>
                            ${listBlock(c.commonGaps || [])}
                        </div>
                        <div class="content-section">
                            <h2><i class="fa-solid fa-star"></i> Histórias recomendadas</h2>
                            ${listBlock(c.recommendedStories || [])}
                        </div>
                    </div>

                    <div class="content-section">
                        <h2><i class="fa-solid fa-book-open"></i> Tópicos para estudar</h2>
                        ${listBlock(c.topicsToStudy || [])}
                    </div>

                    <div class="content-section">
                        <h2><i class="fa-solid fa-diagram-project"></i> Projetos similares</h2>
                        ${listBlock(c.similarProjects || [])}
                    </div>

                    <div class="flex gap-2 mt-2 wrap">
                        <a href="../mock/index.html" class="primary-btn" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 1.4rem;border-radius:12px;color:#fff;font-weight:600;"><i class="fa-solid fa-microphone"></i> Simular entrevista com perguntas</a>
                        <a href="../modules/index.html" class="outline-btn" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 1.4rem;border-radius:12px;font-weight:600;"><i class="fa-solid fa-book-open"></i> Estudar módulos recomendados</a>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = '<div class="glass-card text-center"><h2><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);"></i> Playbook não encontrado</h2><a href="index.html" class="primary-btn mt-3" style="display:inline-flex;">Voltar às empresas</a></div>';
            }
        });
    </script>
</body>
</html>
